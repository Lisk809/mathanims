name: Render Manim Animations

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg \
          texlive \
          texlive-latex-extra \
          texlive-fonts-extra \
          texlive-latex-recommended \
          texlive-science \
          tipa \
          libcairo2-dev \
          libpango1.0-dev\
          pkg-config

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install manim
        #pip install -r requirements.txt  # 如果有其他依赖

    - name: Render Manim animations
      run: |
        # 渲染单个文件
        manim -ql main.py SquareToCircle
        # 或者渲染目录中的所有文件
        # manim -ql ./
        
    - name: Upload rendered videos
      uses: actions/upload-artifact@v4
      with:
        name: manim-videos
        path: media/videos/**/*.mp4
        retention-days: 30
